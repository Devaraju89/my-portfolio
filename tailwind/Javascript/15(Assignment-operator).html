<!DOCTYPE html>
<html>
<head>
    <title>Assignment Operators in JavaScript</title>
    <style>
       
    </style>
</head>
<body>

    <h2>JavaScript Assignment Operators</h2>

    <div id="assign"></div>  
    <div id="addAssign"></div>
    <div id="subAssign"></div>
    <div id="mulAssign"></div>
    <div id="divAssign"></div>
    <div id="modAssign"></div>
    <div id="expAssign"></div>
    <div id="bitwiseAndAssign"></div>
    <div id="bitwiseOrAssign"></div>
    <div id="bitwiseXorAssign"></div>
    <div id="leftShiftAssign"></div>
    <div id="rightShiftAssign"></div>

    <script>
        // Declare and assign variables
        let a = 10;
        let b = 5;

        // Simple Assignment
        let x = a;
        document.getElementById("assign").innerHTML = "Assignment: x = " + x;

        // Add and Assign
        x += b; // x = x + b
        document.getElementById("addAssign").innerHTML = "Add and Assign: x += b → " + x;

        // Subtract and Assign
        x -= b; // x = x - b
        document.getElementById("subAssign").innerHTML = "Subtract and Assign: x -= b → " + x;

        // Multiply and Assign
        x *= b; // x = x * b
        document.getElementById("mulAssign").innerHTML = "Multiply and Assign: x *= b → " + x;

        // Divide and Assign
        x /= b; // x = x / b
        document.getElementById("divAssign").innerHTML = "Divide and Assign: x /= b → " + x;

        // Modulus and Assign
        x %= b; // x = x % b
        document.getElementById("modAssign").innerHTML = "Modulus and Assign: x %= b → " + x;

        // Exponentiation and Assign
        x = a; // Reset x to original value
        x **= b; // x = x ** b
        document.getElementById("expAssign").innerHTML = "Exponentiation and Assign: x **= b → " + x;

        // Bitwise AND and Assign
        x = a;
        x &= b; // x = x & b
        document.getElementById("bitwiseAndAssign").innerHTML = "Bitwise AND and Assign: x &= b → " + x;

        // Bitwise OR and Assign
        x = a;
        x |= b; // x = x | b
        document.getElementById("bitwiseOrAssign").innerHTML = "Bitwise OR and Assign: x |= b → " + x;

        // Bitwise XOR and Assign
        x = a;
        x ^= b; // x = x ^ b
        document.getElementById("bitwiseXorAssign").innerHTML = "Bitwise XOR and Assign: x ^= b → " + x;

        // Left Shift and Assign
        x = a;
        x <<= 1; // x = x << 1
        document.getElementById("leftShiftAssign").innerHTML = "Left Shift and Assign: x <<= 1 → " + x;

        // Right Shift and Assign
        x = a;
        x >>= 1; // x = x >> 1
        document.getElementById("rightShiftAssign").innerHTML = "Right Shift and Assign: x >>= 1 → " + x;
    </script>

</body>
</html>
