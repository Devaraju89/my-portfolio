<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS First Page</title>
</head>
<body>
    <button onclick="showMessage()">Click Me!</button>
    <div id="content"></div>

    <script>
        function showMessage() {
            document.getElementById('content').innerText = 'Welcome to my JS first page';
        }
    </script>
</body>
</html>
