<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Box Model Example</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <div class="container mx-auto my-12">
        <h1 class="text-3xl font-bold text-center mb-8">Tailwind CSS Box Model Example</h1>

        <!-- Box Model Example -->
        <div class="flex justify-center">
            <div class="bg-blue-500 text-white p-6 rounded-lg shadow-lg">
                <h2 class="text-2xl font-semibold mb-4">Box Model</h2>
                <p class="mb-4">This box demonstrates the properties of the box model using Tailwind CSS.</p>

                <!-- Padding -->
                <div class="bg-white text-gray-700 p-4 rounded border mb-4">
                    <h3 class="font-bold">Padding</h3>
                    <p>This box has <code class="bg-gray-200 p-1 rounded">p-4</code>, which means padding of 1rem (16px).</p>
                </div>

                <!-- Margin -->
                <div class="bg-white text-gray-700 p-4 rounded border mb-4">
                    <h3 class="font-bold">Margin</h3>
                    <p>This box has <code class="bg-gray-200 p-1 rounded">m-4</code>, which means margin of 1rem (16px).</p
