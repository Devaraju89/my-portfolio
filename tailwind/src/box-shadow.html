<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Shadow Colors</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="p-8 text-center">
        <h1 class="text-2xl font-bold text-gray-700 mb-6">Box Shadow Color</h1>
        <div class="grid grid-cols-3 gap-6">
            <div class="p-6 bg-white shadow-[0_4px_10px_theme('colors.orange.100')] rounded-lg">
                shadow-orange-100
            </div>
            <div class="p-6 bg-white shadow-[0_4px_10px_theme('colors.amber.700')] rounded-lg">
                shadow-amber-700
            </div>
            <div class="p-6 bg-white shadow-[0_4px_10px_theme('colors.cyan.500/50')] rounded-lg">
                shadow-cyan-500/50
            </div>
            <div class="p-6 bg-white shadow-[0_4px_10px_theme('colors.lime.200')] rounded-lg">
                shadow-lime-200
            </div>
            <div class="p-6 bg-white shadow-[0_4px_10px_theme('colors.green.950')] rounded-lg">
                shadow-green-950
            </div>
            <div class="p-6 bg-white shadow-[0_4px_10px_theme('colors.teal.500')] rounded-lg">
                shadow-teal-500
            </div>
        </div>
    </div>
</body>
</html>
