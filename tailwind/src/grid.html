<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Grid Layout Example</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Grid Container -->
    <div class="grid grid-cols-3 gap-6 p-6">

        <!-- Grid Item 1 -->
        <div class="bg-red-300 p-6 text-center text-green-50">Item 1</div>

        <!-- Grid Item 2 -->
        <div class="bg-blue-300 p-6 text-center">Item 2</div>

        <!-- Grid Item 3 -->
        <div class="bg-green-300 p-6 text-center">Item 3</div>

        <!-- Grid Item 4 (Spans 2 Columns) -->
        <div class="bg-yellow-300 p-6 text-center col-span-2">
            Item 4 (spans 2 columns)
        </div>

        <!-- Grid Item 5 (Spans 2 Rows) -->
        <div class="bg-purple-300 p-6 text-center row-span-2">
            Item 5 (spans 2 rows)
        </div>

        <!-- Grid Item 6 -->
        <div class="bg-pink-300 p-6 text-center">Item 6</div>

        <!-- Grid Item 7 -->
        <div class="bg-teal-300 p-6 text-center">Item 7</div>

        <!-- Grid Item 8 -->
        <div class="bg-indigo-300 p-6 text-center">Item 8</div>
    </div>

</body>
</html>
