<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Login Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-10 rounded-lg shadow-lg w-96 h-[400px] text-center flex flex-col justify-center">
        <h2 class="text-3xl font-bold text-gray-700 mb-8">Login</h2>
        <form>
            <div class="mb-6 text-left">
                <label class="block text-red-400 mb-1">Username</label>
                <input type="text" class="w-full p-3 border border-gray-300 rounded mt-1" placeholder="Enter your username">
            </div>
            <div class="mb-6 text-left">
                <label class="block text-red-400 mb-1">Password</label>
                <input type="password" class="w-full p-3 border border-gray-300 rounded mt-1" placeholder="Enter your password">
            </div>
            <button type="submit" class="w-full bg-red-700 text-white py-3 rounded hover:bg-red-800">Login</button>
        </form>
    </div>
</body>
</html>
