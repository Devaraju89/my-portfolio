<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="justify-center text-center min-h-screen bg-gray-100 flex items-center">
    <div class="flex flex-col items-center justify-center w-full max-w-md p-6 bg-white rounded-lg shadow-md">
       
         <h3 class="text-2xl text-start text-purple-800">Form Validation</h3>
        <form id="form" class="w-full mt-4 space-y-4">
            <div class="flex flex-col items-start w-full">
                <label for="name" class="text-sm text-gray-700">Name</label>
                <input type="text" id="name" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-purple-500" required>
            </div>
            <div class="flex flex-col items-start w-full">
                <label for="email" class="text-sm text-gray-700">Email</label>
                <input type="email" id="email" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-purple-500" required>
            </div>
            <div class="flex flex-col items-start w-full">
                <label for="password" class="text-sm text-gray-700">Password</label>
                <input type="password" id="password" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:ring-purple-500" required>
            <button type="submit" class="w-full px-4 py-2 font-semibold text-white bg-purple-600 rounded hover:bg-purple-700">Submit</button>
    </div>
</body>
</html>
