<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dynamic Task Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col items-center justify-start min-h-screen bg-amber-50 py-10 text-center">

  <div class="flex items-center gap-4 p-4 border-2 border-amber-900 bg-white rounded-lg shadow-md">
    <h1 class="text-xl font-bold text-amber-900">Dynamic Task Manager</h1>
    <input type="text" id="taskInput" placeholder="Enter your task" class="px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-amber-500"/>
    <button id="addTaskBtn" class="px-4 py-2 font-semibold text-white bg-amber-600 rounded hover:bg-amber-700">
      Add Task
    </button>
  </div>

  <ul id="taskList" class="mt-6 space-y-2 w-[300px]">
    <!-- Tasks will be added here dynamically -->
  </ul>

  <script>
    const addTaskBtn = document.getElementById('addTaskBtn');
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');

    addTaskBtn.addEventListener('click', () => {
      const taskText = taskInput.value.trim();
      if (taskText !== '') {
        const li = document.createElement('li');
        li.textContent = taskText;
        li.className = 'px-4 py-2 bg-white border border-amber-500 rounded shadow-sm hover:bg-amber-100 cursor-pointer';
        taskList.appendChild(li);
        taskInput.value = '';
      } else {
        alert('Please enter a task!');
      }
    });
  </script>
</body>
</html>
