<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disappear Paragraphs</title>
    <script src="https://code.jquery.com/jquery-2.2.4.js" integrity="sha256-iT6Q9iMJYuQiMWNd9lDyBUStIq/8PuOW33aOqmvFpqI=" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function() {
            $("button").click(function() {
                $(".test").hide(); // Hide all elements with class="test"
            });
        });
    </script>
</head>
<body>
    <h2>This is a heading</h2>
    <p class="test">This is a paragraph with class 'test'.</p>
    <p class="test">This is another paragraph with class 'test'.</p>
    <p>This is a paragraph without the class.</p>
    <button>Click Here to Hide Paragraphs with Class 'test'</button>
</body>
</html>
