<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Countdown Timer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-indigo-100">

  <div class="bg-white shadow-lg rounded-xl p-8 w-full max-w-md text-center">
    <h1 class="text-2xl font-bold text-indigo-700 mb-4">Countdown Timer</h1>
    <input id="timeInput" type="number" placeholder="Enter seconds"
      class="w-full border border-gray-300 rounded-md p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
    <button onclick="startCountdown()"
      class="bg-indigo-600 text-white font-semibold px-4 py-2 rounded-md hover:bg-indigo-700">
      Start Countdown
    </button>
    <div class="mt-6 text-3xl font-mono text-indigo-800" id="display">00:00</div>
  </div>

  <script>
    function startCountdown() {
      const input = document.getElementById('timeInput');
      const display = document.getElementById('display');
      let seconds = parseInt(input.value);

      if (isNaN(seconds) || seconds < 0) {
        alert("Please enter a valid number of seconds.");
        return;
      }
      if (window.countdownInterval) {
        clearInterval(window.countdownInterval);
      }

      window.countdownInterval = setInterval(() => {
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        display.textContent = ${mins}:${secs};

        if (seconds <= 0) {
          clearInterval(window.countdownInterval);
        }

        seconds--;
      }, 1000);
    }
  </script>

</body>
</html>
